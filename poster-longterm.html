<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUZU Family House — Long-Term Rental Poster</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f2b24;font-family:Arial,sans-serif;color:#fff;display:grid;place-items:center;min-height:100vh;padding:20px}
  .wrap{width:min(1080px,100%);display:grid;gap:14px;justify-items:center}
  canvas{width:100%;height:auto;background:#f6f0e6;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button,a{border:0;border-radius:999px;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer}
  button{background:#d6ad63;color:#14281f}
  a{background:#fff;color:#14281f}
  .note{font-size:12px;color:#c9d7d0;text-align:center;max-width:780px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="poster" width="1080" height="1350"></canvas>
  <div class="actions">
    <button id="download">Download PNG 1080×1350</button>
    <a href="/" target="_blank">Open ZUZU Website</a>
  </div>
  <div class="note">This poster uses the original ZUZU Family House property photos from the website. No AI-generated villa, pool, garden or interior imagery is used.</div>
</div>
<script>
const canvas=document.getElementById('poster');
const ctx=canvas.getContext('2d');

const C={forest:'#0f2b24',forest2:'#12372d',gold:'#c99a45',cream:'#f7f1e7',ink:'#173329',muted:'#6f756f',white:'#ffffff'};

function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function cover(img,x,y,w,h){
  const r=Math.max(w/img.width,h/img.height);
  const sw=w/r, sh=h/r;
  const sx=(img.width-sw)/2, sy=(img.height-sh)/2;
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function contain(img,x,y,w,h){
  const r=Math.min(w/img.width,h/img.height);
  const dw=img.width*r, dh=img.height*r;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function text(t,x,y,size,weight='400',color=C.ink,font='Arial',align='left'){
  ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(t,x,y);
}
function wrap(t,x,y,maxW,lineH,size,weight='400',color=C.ink,font='Arial'){
  ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign='left';ctx.textBaseline='top';
  const words=t.split(' ');let line='',yy=y;
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxW && line){ctx.fillText(line,x,yy);line=word;yy+=lineH;} else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy+lineH;
}
function pill(x,y,w,h,label){
  roundRect(x,y,w,h,h/2,C.forest);
  text(label,x+w/2,y+11,24,'700',C.cream,'Arial','center');
}

Promise.all([
  load('assets/zuzu-logo-official.png?v=6'),
  load('assets/gallery/zuzu-pool.jpg'),
  load('assets/gallery/zuzu-bedroom-heritage.jpg'),
  load('assets/gallery/zuzu-dining.jpg'),
  load('assets/gallery/zuzu-balcony.jpg')
]).then(([logo,pool,bed,dining,balcony])=>{
  ctx.fillStyle=C.cream;ctx.fillRect(0,0,1080,1350);

  // header
  ctx.fillStyle=C.cream;ctx.fillRect(0,0,1080,150);
  contain(logo,60,28,430,92);
  text('LONG-TERM VILLA RENTAL',1020,36,20,'700',C.forest,'Arial','right');
  text('PERERENAN · BADUNG · BALI',1020,72,18,'600',C.gold,'Arial','right');

  // main photo: ORIGINAL ZUZU POOL PHOTO
  ctx.save();ctx.beginPath();ctx.roundRect(50,160,980,505,28);ctx.clip();cover(pool,50,160,980,505);ctx.restore();
  const grad=ctx.createLinearGradient(50,160,620,160);grad.addColorStop(0,'rgba(8,34,27,.92)');grad.addColorStop(.58,'rgba(8,34,27,.45)');grad.addColorStop(1,'rgba(8,34,27,0)');
  ctx.fillStyle=grad;ctx.fillRect(50,160,700,505);

  text('PERERENAN',90,205,18,'700',C.gold);
  text('Charming Villa',90,250,57,'700',C.white,'Georgia');
  text('for Long-Term Rent',90,312,57,'700',C.white,'Georgia');
  wrap('A 2-story, 3-bedroom villa with ensuite bathrooms, private swimming pool and tropical garden. Offered directly by the owner.',90,395,450,37,25,'400',C.white,'Arial');
  pill(90,540,310,54,'IDR 3 BILLION / 5 YEARS');
  text('NEGOTIABLE',245,606,18,'700',C.gold,'Arial','center');

  // feature strip
  const fy=690;
  const features=[
    ['3 BEDROOMS','Ensuite bathrooms'],
    ['400 M²','Land size'],
    ['PRIVATE POOL','Tropical garden'],
    ['5,500 W','Electricity']
  ];
  features.forEach((f,i)=>{
    const x=55+i*255;
    roundRect(x,fy,235,88,18,'#ffffff', '#e2d6c2');
    text(f[0],x+18,fy+17,21,'700',C.forest);
    text(f[1],x+18,fy+49,16,'500',C.muted);
  });

  // original photo thumbnails
  const ty=805, tw=310, th=205, gap=25;
  [[bed,'Bedroom'],[dining,'Living & dining'],[balcony,'Upper floor / loft area']].forEach((item,i)=>{
    const x=50+i*(tw+gap);
    ctx.save();ctx.beginPath();ctx.roundRect(x,ty,tw,th,20);ctx.clip();cover(item[0],x,ty,tw,th);ctx.restore();
    ctx.fillStyle='rgba(10,32,26,.72)';ctx.fillRect(x,ty+160,tw,45);
    text(item[1],x+14,ty+171,17,'700',C.white);
  });

  // bottom info
  roundRect(50,1035,980,255,26,C.forest);
  text('Long-term living, ready from day one.',80,1067,32,'700',C.cream,'Georgia');
  const left=[
    'Housekeeping every 2 days',
    'Toiletries & cooking essentials provided',
    'Gas & drinking water included',
    'Wi-Fi (4G/5G) · 24-hour security cameras'
  ];
  left.forEach((t,i)=>{text('✓',82,1120+i*36,20,'700',C.gold);text(t,112,1120+i*36,18,'500',C.white);});
  const right=[
    'Open-plan living & dining',
    'Spacious kitchen + bar area',
    'Large open loft upstairs',
    'Shared parking · Family-friendly'
  ];
  right.forEach((t,i)=>{text('✓',560,1120+i*36,20,'700',C.gold);text(t,590,1120+i*36,18,'500',C.white);});

  text('Quiet Pererenan location · Easy main-road access · Close to beach, shops, supermarkets, cafés & restaurants',540,1247,17,'500','#d9e4df','Arial','center');
  roundRect(260,1305,560,36,18,C.gold);
  text('WhatsApp 0822 4797 2288 · Schedule a viewing',540,1312,18,'700',C.forest,'Arial','center');
}).catch(err=>{ctx.fillStyle='#fff';ctx.fillText('Unable to load original property images.',50,50);console.error(err);});

document.getElementById('download').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='ZUZU-Family-House-Long-Term-Rental-Poster.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
